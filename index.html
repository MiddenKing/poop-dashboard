<!DOCTYPE html>
<html>
<head>
    <title>The Anonymous Poop Observatory</title>
    <style>
        body {
            max-width: 1000px;
            margin: auto;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
        }

        .statbox {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .stat {
            text-align: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 30%;
        }

        img {
            max-width: 100%;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<h1>The Anonymous Poop Observatory</h1>

<p align="center">
Tracking bowel behaviour one observation at a time.
</p>

<div class="statbox">
    <div class="stat">
        <h3>Total observations</h3>
        <p>238</p>
    </div>

    <div class="stat">
        <h3>Average per day</h3>
        <p>1.69</p>
    </div>

    <div class="stat">
        <h3>Poor poop rate</h3>
        <p>10.1%</p>
    </div>
</div>

<h2>Plots</h2>

<p>
Plots will appear here automatically once we start uploading figures.
</p>

</body>
</html>
