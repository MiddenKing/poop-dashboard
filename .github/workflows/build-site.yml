name: Build poop dashboard

on:
  push:
    paths:
      - "data/poop_data.csv"
      - "scripts/build_site.py"
      - "scripts/build_observatory.py"
      - ".github/workflows/build-site.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build dashboard
        run: python scripts/build_site.py
      - name: Build observatory
        run: python scripts/build_observatory.py
      - name: Commit generated site
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html observatory.html figures summary.json
          git commit -m "Update dashboard" || echo "No changes to commit"
          git push
